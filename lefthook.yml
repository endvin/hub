pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "**/package-lock.json"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      # The script selects separate Node and React source sets and tsconfigs.
      # Appending e2e files checks them with the React tsconfig instead of tsconfig.e2e.json.
      run: npm run lint
    - name: typecheck
      run: npm run typecheck

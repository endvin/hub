# Hub 从主干构建制品，服务器只拉取镜像，不编译。
# 产物：docker.cnb.cool/ppb/hub:${CNB_COMMIT_SHORT} 与 :latest
main:
  push: &hub_release_pipeline
    - runner:
        # 走「云原生开发」配额（声明 vscode）；云原生构建配额已耗尽时不声明会在 Prepare 被拒。
        cpus: 8
      services:
        - docker
        - vscode
      stages:
        - name: quality gates
          image: node:22-bookworm
          script: |
            set -eu
            npm ci --no-audit --no-fund
            npm run typecheck
            npm run db:check
            npm run lint
            npm run format:check
            npx vitest run src/auth/clawmuse-devices.test.ts --bail=1

        - name: build and push image
          script: |
            set -eu
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker build -t "${IMAGE}:${CNB_COMMIT_SHORT}" -t "${IMAGE}:latest" .
            docker push "${IMAGE}:${CNB_COMMIT_SHORT}"
            docker push "${IMAGE}:latest"

# 复用正式镜像流水线；触发分支只引用 main 上的提交。
"platform-cloud/*":
  push: *hub_release_pipeline

# CNB 云原生构建：在 CNB 上编译并推送镜像，服务器只拉取不编译（部署铁律 1）。
#
# 线上 agent-hub.ppb.cn 跑的是 codex/endtoai-branding 分支（Clawmuse 设备授权、schema 0047），
# 不是上游 main。2026-10-21 起镜像从这里出：此前的镜像是在 sg-dokploy（C2 中招机）本机构建的，
# 迁移时不再沿用。
#
# 产物：docker.cnb.cool/ppb/hub:${CNB_COMMIT_SHORT} 与 :latest
codex/endtoai-branding:
  push:
    - runner:
        # 走「云原生开发」配额（声明 vscode）；云原生构建配额已耗尽时不声明会在 Prepare 被拒。
        cpus: 8
      services:
        - docker
        - vscode
      stages:
        - name: quality gates
          image: node:22-bookworm
          script: |
            set -eu
            npm ci --no-audit --no-fund
            npm run typecheck
            npm run db:check

        - name: build and push image
          script: |
            set -eu
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker build -t "${IMAGE}:${CNB_COMMIT_SHORT}" -t "${IMAGE}:latest" .
            docker push "${IMAGE}:${CNB_COMMIT_SHORT}"
            docker push "${IMAGE}:latest"

# 专用触发分支只引用 main 上的提交，不保存开发改动。
"platform-cloud/*":
  push:
    - name: clawmuse-cloud-accounts
      runner:
        cpus: 8
      services: [docker, vscode]
      stages:
        - name: account quality gates
          image: node:22-bookworm
          timeout: 20m
          script: |
            set -eu
            npm ci --no-audit --no-fund
            npm run typecheck
            npm run lint
            npm run format:check
            npx vitest run src/auth/clawmuse-devices.test.ts --bail=1
        - name: hub image
          timeout: 30m
          script: |
            set -eu
            docker build --label "org.opencontainers.image.revision=${CNB_COMMIT}" -t "docker.cnb.cool/ppb/hub:${CNB_COMMIT_SHORT}" -t docker.cnb.cool/ppb/hub:latest .
            docker push "docker.cnb.cool/ppb/hub:${CNB_COMMIT_SHORT}"
            docker push docker.cnb.cool/ppb/hub:latest
